name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ hashFiles('.github/workflows/scripts/windows/build-dependencies.bat') }}

      - name: Build Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call .github\workflows\scripts\windows\build-dependencies.bat
        env:
          DEBUG: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: msbuild PCSX2_qt.sln /m /v:m /p:Configuration=Release /p:Platform=x64

      - name: Download RTX Remix Runtime
        shell: pwsh
        run: |
          # Get latest RTX Remix release
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/NVIDIAGameWorks/rtx-remix/releases/latest"
          # Get the release zip (not debug, not symbols)
          $asset = $release.assets | Where-Object { $_.name -match "^remix-.*-release\.zip$" } | Select-Object -First 1
          if (-not $asset) {
            Write-Error "Could not find RTX Remix release asset"
            exit 1
          }
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "remix-runtime.zip"
          Expand-Archive -Path "remix-runtime.zip" -DestinationPath "remix-runtime"
          Write-Host "Contents:"
          Get-ChildItem -Path "remix-runtime" -Recurse -Depth 2 | Select-Object FullName

      - name: Prepare Release Package
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $outDir = "PCSX2-RTX-Remix-$tag"
          New-Item -ItemType Directory -Path $outDir -Force
          
          # Copy executables and DLLs from bin
          Copy-Item "bin/*.exe" $outDir/
          Copy-Item "bin/*.dll" $outDir/ -ErrorAction SilentlyContinue
          
          # Copy deps DLLs
          Copy-Item "deps/bin/*.dll" $outDir/
          
          # Copy resources
          Copy-Item -Recurse "bin/resources" $outDir/
          
          # Copy Qt plugins and config
          Copy-Item -Recurse "bin/QtPlugins" $outDir/ -ErrorAction SilentlyContinue
          Copy-Item "bin/qt.conf" $outDir/ -ErrorAction SilentlyContinue
          
          # Copy RTX config
          Copy-Item "bin/rtx.conf" $outDir/ -ErrorAction SilentlyContinue
          
          # Copy RTX Remix runtime files
          $remixDir = Get-ChildItem -Path "remix-runtime" -Directory | Select-Object -First 1
          if ($remixDir) {
            Copy-Item -Path "$($remixDir.FullName)/*" -Destination $outDir/ -Recurse -Force
          }
          
          # Create archive
          7z a "$outDir.7z" $outDir

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCSX2-RTX-Remix
          path: PCSX2-RTX-Remix-*.7z

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: PCSX2-RTX-Remix

      - name: Get Tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ${{ steps.get_tag.outputs.tag }}
          files: PCSX2-RTX-Remix-*.7z
          draft: false
          prerelease: ${{ contains(steps.get_tag.outputs.tag, 'alpha') || contains(steps.get_tag.outputs.tag, 'beta') || contains(steps.get_tag.outputs.tag, 'rc') }}
          generate_release_notes: true
